[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaggle-free-gpu"
version = "0.1.0"
description = "Give any coding agent free Tesla T4 x2 GPUs via Kaggle's REST API -- MCP server, CLI, and skill."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Eric Maddox", email = "eric.maddox@outlook.com" }
]
keywords = [
    "mcp",
    "mcp-server",
    "kaggle",
    "gpu",
    "free-gpu",
    "tesla-t4",
    "ai-agents",
    "claude-code",
    "cursor",
    "antigravity",
    "qlora",
    "llama-cpp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "mcp>=1.3.0,<2.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "rich>=13.9.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
kaggle-free-gpu-mcp = "kaggle_free_gpu.server:main"
kaggle-free-gpu = "kaggle_free_gpu.cli:main"
kfg = "kaggle_free_gpu.cli:main"

[project.urls]
Homepage = "https://github.com/ericmaddox/kaggle-free-gpu"
Repository = "https://github.com/ericmaddox/kaggle-free-gpu.git"
Issues = "https://github.com/ericmaddox/kaggle-free-gpu/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_free_gpu"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

